# This file references environment variables from .env.properties in the project root
# Use EnvironmentManager.java to update these values programmatically

# Settings
settings.perfElo.enabled=${SETTINGS_PERFELO_ENABLED:true}
settings.allowNonAdminUploads=${SETTINGS_ALLOWNONADMINUPLOADS:false}
settings.allowAllChannelsProcessing=${SETTINGS_ALLOWALLCHANNELSPROCESSING:true}
settings.homeHall=${SETTINGS_HOMEHALL:}
settings.maxSeeds=${SETTINGS_MAXSEEDS:368.5}
settings.timezone=${SETTINGS_TIMEZONE:0}

# Internet Connectivity
internet.webhook.url=${INTERNET_WEBHOOK_URL:}
internet.webhook.port=${INTERNET_WEBHOOK_PORT:}
internet.webhook.timeoutMs=${INTERNET_WEBHOOK_TIMEOUTMS:5000}

# Discord Bot Configuration
discord.bot.token=${DISCORD_BOT_TOKEN:}
discord.log.channelId=${DISCORD_LOG_CHANNELID:}
discord.admin.userId=${DISCORD_ADMIN_USERID:}

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.admin.userId=${TELEGRAM_ADMIN_USERID:}
telegram.devChatId=${TELEGRAM_DEV_CHATID:}
telegram.devChatId.log=${TELEGRAM_DEV_CHATID_LOG:}
telegram.devChatId.status=${TELEGRAM_DEV_CHATID_STATUS:}
telegram.publicChatId=${TELEGRAM_PUBLIC_CHATID:}
telegram.publicChatId.fileupload=${TELEGRAM_PUBLIC_CHATID_FILEUPLOAD:}
telegram.publicChatId.commands=${TELEGRAM_PUBLIC_CHATID_COMMANDS:}
